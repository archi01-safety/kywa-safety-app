{
  "services": [
    {
      "type": "web",
      "name": "kywa-safety",
      "runtime": "docker",
      "plan": "free",
      "region": "singapore",
      "repo": "https://github.com/archi01-safety/kywa-safety-app",
      "branch": "codex/kywa-next",
      "rootDir": "kywa-next",
      "dockerfilePath": "./Dockerfile",
      "dockerContext": ".",
      "healthCheckPath": "/healthz",
      "autoDeployTrigger": "off",
      "envVars": [
        {
          "key": "ORGANIZATION_ID",
          "value": "kywa"
        },
        {
          "key": "APP_ENV",
          "value": "production"
        },
        {
          "key": "ALLOW_LEGACY_WRITES",
          "value": "true"
        },
        {
          "key": "APP_BASE_URL",
          "value": "https://kywa-safety.onrender.com"
        },
        {
          "key": "SESSION_SECRET",
          "generateValue": true
        },
        {
          "key": "AUTH_MODE",
          "value": "pin"
        },
        {
          "key": "ADMIN_PIN_HASH",
          "sync": false
        },
        {
          "key": "GOOGLE_SERVICE_ACCOUNT_JSON",
          "sync": false
        },
        {
          "key": "GEMINI_API_KEY",
          "sync": false
        },
        {
          "key": "GEMINI_MODEL",
          "sync": false
        },
        {
          "key": "KOSHA_API_KEY",
          "sync": false
        },
        {
          "key": "PYTHONUNBUFFERED",
          "value": "1"
        },
        {
          "key": "REPORT_MAX_ROWS",
          "value": "100"
        }
      ]
    },
