name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast3 # 서울 리전

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Google Auth
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    - name: Configure Docker for GCP
      run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev

    - name: Build and Push Docker Image
      run: |
        gcloud artifacts repositories create kywa-repo --repository-format=docker --location=asia-northeast3 --quiet || true
        gcloud builds submit --tag asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kywa-repo/safety-app:latest .

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy kywa-safety-app \
          --image asia-northeast3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/kywa-repo/safety-app:latest \
          --region asia-northeast3 \
          --allow-unauthenticated \
          --set-env-vars GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
